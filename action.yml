name: 'Setup tarantool'
description: 'Setup tarantool environment with caching'
branding:
  icon: 'code'
  color: 'red'
inputs:
  tarantool-version:
    description: Tarantool version
  tt-version:
    description: >-
      tt version to install from GitHub releases, tt is not installed
      if it is empty. Tarantool < 3 always gets tt 2
    required: false
  github-token:
    description: Token to query tt releases with GitHub API
    required: false
    default: ${{ github.token }}
  nightly-build:
    description: Whether to install a nightly build
    required: false
    default: false
  cache-key:
    description: Deprecated. Custom key used for APT packages caching
    required: false
runs:
  using: 'node20'
  main: dist/index.js
